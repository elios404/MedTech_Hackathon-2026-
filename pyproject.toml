[project]
name = "surgiwaste-ai"
version = "0.1.0"
description = "Hospital Operating Theatre Clinical Waste Intelligence System"
readme = "README.md"
authors = [
    { name = "SurgiWaste Team" }
]
requires-python = ">=3.11"
dependencies = [
    "clip",
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "ultralytics>=8.3.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vision_system"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }
